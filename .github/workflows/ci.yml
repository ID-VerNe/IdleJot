name: Windows validation
on:
  push:
    branches: [slim, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    # slim is Windows-only (taskkill/WMI/.pyw, pywin32); there is no Linux
    # terminal chain to validate anymore, so this is the only job.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      # Pinned to an exact tag, same rule as setup-uv below. v5 runs on
      # Node.js 24, which clears the Node 20 deprecation annotation (#25).
      - uses: actions/checkout@v5.1.0
      # The repo is uv-managed (pyproject.toml + uv.lock); there is no
      # requirements/ tree. setup-uv caches on uv.lock by default.
      # NOTE: pin an exact tag - setup-uv publishes no bare major tag for
      # the v10 line (v10.3.2 exists, v10 does not), and GitHub Actions
      # resolves actions by exact ref only.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.13'
      - name: Sync pinned dependencies
        run: uv sync --frozen
      - name: Regression suite
        shell: pwsh
        run: |
          $checks = @(
            # Commit gate: publication scan and path hygiene (issue #14 class)
            'check_publication.py',
            'check_path_hygiene.py',
            'check_no_console_child.py',
            'check_listen_passthrough.py',
            'check_issue_16_audit_fixes.py',
            # Daemon entry smoke and stop-stack integrity
            'check_daemon_entries.py',
            'check_stop_stack.py',
            'check_bootstrap_health.py',
            'check_napcat_launch_order.py',
            'check_water_group_import.py',
            # MCP protocol and chat contract
            'check_mcp.py',
            'check_mcp_onebot.py',
            'check_mcp_chat_output.py',
            'check_mcp_chat_turns.py',
            'check_mcp_reactions.py',
            'check_mcp_language_learning.py',
            'check_mcp_language_integration.py',
            'check_mcp_multi_group_learning.py',
            'check_mcp_jargon_matching.py',
            'check_mcp_jargon_pipeline.py',
            'check_mcp_expression_evidence.py',
            # Memory engine, personas and planning
            'check_memory_engine_imports.py',
            'check_group_memory.py',
            'check_text_truncation.py',
            # dossier.py 写入动词：载荷校验、超长拒绝、游标只在写入成功后推进（issue #6）
            'check_dossier_ingest.py',
            # 私有目录巡检：tmp/ 禁脚本、bin+archive 必须登记、drafts 发完即删（issue #6）
            'check_tmp_hygiene.py',
            # One backend start must write one startup banner (issue #97)
            'check_app_log_once.py',
            'check_anti_habituation.py',
            'check_plan_recovery.py',
            # Water-group daemons: wake ledger, follow-up, replies, commands
            'check_wake_ledger.py',
            'check_forward_wake.py',
            'check_followup.py',
            'check_pending_reply.py',
            'check_reply_context.py',
            'check_reply_quote.py',
            'check_quote_visibility.py',
            'check_reply_timing.py',
            'check_now_clock.py',
            'check_slash_commands.py',
            'check_miyoushe.py',
            'check_sixty.py',
            'check_plugin_registry.py',
            # App-side plugin protocol: static surface, degrade-on-disable, no name branches (issue #4 PD)
            'check_app_plugins.py',
            'check_qr_login.py',
            'check_log_encoding.py',
            'check_watchdog_token.py',
            'check_collector_self_echo.py',
            # Module size walls: no file >1000 lines, no class >800 (issue #11 PE)
            'check_module_size.py',
            # NapCat / OneBot contract and account diagnostics
            'check_napcat_onebot_contract.py',
            'check_napcat_qq_probe.py',
            'check_qq_account_diagnostics.py',
            'check_upgrade.py'
          )
          foreach ($check in $checks) {
            # Publication gate also scans commit identities and messages; it
            # derives personal tokens from the private store when present
            # (CI has none, so CI covers credentials, paths and history).
            if ($check -eq 'check_publication.py') {
              uv run --frozen python "scripts/$check" --history
            } else {
              uv run --frozen python "scripts/$check"
            }
            if ($LASTEXITCODE -ne 0) { throw "$check failed" }
          }
