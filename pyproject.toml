[project]
name = "idlejot"
version = "0.5.6"
description = "IdleJot (闲笔): a resident QQ-group AI agent."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    # mcp pinned to 1.x: mcp_server.py uses the lowlevel @protocol.list_tools()
    # / @protocol.call_tool() decorator API, removed in mcp 2.x. websockets pinned
    # to 15.x: the chat gate's Events fixture uses websockets.sync.server API.
    "mcp>=1.26,<2",
    "websockets>=15,<16",
    "fastapi",
    "uvicorn",
    "httpx",
    "requests",
    "python-dotenv",
    "jsonschema",
    "dnspython",
    "Pillow",
    "opencc-python-reimplemented",
    "pysilk-mod",
    "pywin32 ; sys_platform == 'win32'",
    "segno>=1.6.6",
]

[tool.uv]
package = false
